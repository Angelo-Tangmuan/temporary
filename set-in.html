<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | Set IN and Select Route</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="style-additions.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="confirm.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <header class="header">
            <a href="admin.html" class="back-btn"><i class="bi bi-chevron-left"></i></a>
            <div>
                <p class="header-label mb-1">Van ABC 1234</p>
                <h1 class="header-title mb-0">Arrived at Terminal</h1>
            </div>
        </header>

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <div class="form-card">
                    <div>
                        <span class="field-label">Route</span>
                        <div class="role-toggle">
                            <input type="radio" class="btn-check" name="route" id="route-lipa" value="lipa" checked>
                            <label class="role-option" for="route-lipa">Lipa</label>

                            <input type="radio" class="btn-check" name="route" id="route-san-pablo" value="san-pablo">
                            <label class="role-option" for="route-san-pablo">San Pablo</label>
                        </div>
                    </div>
                </div>

                <a href="passengers.html" class="btn btn-vango-primary w-100" 
                data-confirm-title="Set status to IN?" 
                data-confirm-message="Van ABC 1234 will be marked as arrived. The IN time will be recorded in the arrived history."
                data-confirm-yes="Yes, Set IN">Confirm IN</a>

            </div>
        </main>

    </div>
<script src="confirm.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | Passengers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="style-additions.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">

        <!-- Header (phone and tablet; hidden on desktop by style.css) -->
        <header class="mobile-header">
            <p class="mobile-header-label mb-1">Van ABC 1234</p>
            <h1 class="mobile-header-title mb-0">Passengers</h1>
        </header>

        <!-- Sidebar (desktop only). Driver pages highlight "Driver / Operator" -->
        <aside class="sidebar flex-shrink-0 p-4">
            <a href="index.html" class="sidebar-brand text-white text-decoration-none">VanGo</a>
            <nav>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><span class="nav-link px-0">Passenger</span></li>
                    <li class="nav-item"><span class="nav-link px-0">Admin</span></li>
                    <li class="nav-item active"><span class="nav-link px-0">Driver / Operator</span></li>
                </ul>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <!-- Heading (desktop only) -->
                <div class="custom-block">
                    <p class="text-muted-custom mb-1">Van ABC 1234</p>
                    <h1 class="page-title mb-0">Passengers</h1>
                </div>

                <!-- Counter card -->
                <div class="form-card">
                    <span class="field-label mb-0">Boarded</span>

                    <div class="counter-row">
                        <button type="button" id="minus-btn" class="counter-btn counter-minus">&minus;</button>
                        <span id="count" class="counter-number">0</span>
                        <button type="button" id="plus-btn" class="counter-btn counter-plus">+</button>
                    </div>

                    <p class="text-muted-custom text-center mb-0">Tap + for each boarding passenger</p>
                </div>

                <!-- Capacity card: the bar is Bootstrap's progress bar, filled by the script below -->
                <div class="form-card">
                    <span class="field-label mb-0">Capacity</span>
                    <div class="progress capacity-bar">
                        <div class="progress-bar" id="capacity-fill" style="width: 0%"></div>
                    </div>
                    <p class="text-muted-custom mb-0" id="capacity-text">0 of 16</p>
                </div>

                <a href="gps-sharing.html" class="btn btn-vango-outline w-100">Next: GPS sharing</a>

            </div>
        </main>

    </div>

    <!-- Counter. Frontend only: the number resets when the page reloads. -->
    <script>
        // Change this to the van's seat count. Also change "0 of 16" in the HTML above.
        const CAPACITY = 16;

        // Change this to start from a different number (the Figma mock shows 7).
        let count = 0;

        const countEl = document.getElementById("count");
        const fillEl = document.getElementById("capacity-fill");
        const textEl = document.getElementById("capacity-text");
        const minusBtn = document.getElementById("minus-btn");
        const plusBtn = document.getElementById("plus-btn");

        // Redraws the number, the bar and the text, so they always agree
        function update() {
            countEl.textContent = count;
            fillEl.style.width = (count / CAPACITY * 100) + "%";
            textEl.textContent = count + " of " + CAPACITY;

            // Stop at 0 and at full capacity
            minusBtn.disabled = count <= 0;
            plusBtn.disabled = count >= CAPACITY;
        }

        minusBtn.addEventListener("click", function () {
            count = count - 1;
            update();
        });

        plusBtn.addEventListener("click", function () {
            count = count + 1;
            update();
        });

        update();
    </script>

</body>
</html>

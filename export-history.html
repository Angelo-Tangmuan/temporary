<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | Export History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="style-additions.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <header class="header">
            <a href="admin.html" class="back-btn"><i class="bi bi-chevron-left"></i></a>
            <div>
                <p class="header-label mb-1">Admin</p>
                <h1 class="header-title mb-0">Export History</h1>
            </div>

            <div class="dropdown">
                <button class="menu-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static">
                    <span class="menu-bar"></span>
                    <span class="menu-bar"></span>
                    <span class="menu-bar"></span>
                </button>

                <ul class="dropdown-menu menu-panel">
                    <li><a class="menu-item" href="create-account.html"><i class="bi bi-person-circle"></i>Create Account</a>
                    </li>
                    <li><a class="menu-item" href="register-van.html"><i class="bi bi-truck-front-fill"></i>Register a Van</a>
                    </li>
                    <li><a class="menu-item" href="registered-vans.html"><i class="bi bi-card-list"></i>View Registered Vans</a>
                    </li>
                    <li><a class="menu-item" href="live-map.html"><i class="bi bi-geo-alt-fill"></i>Open Live Van Map</a></li>
                    <li><a class="menu-item" href="export-history.html"><i class="bi bi-box-arrow-up-right"></i>Export IN/OUT
                            History</a></li>
                </ul>
            </div>
        </header>

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <!-- History list: one row per trip -->
                <div class="van-list">

                    <div class="van-row">
                        <p class="van-plate mb-1">ABC 1234</p>
                        <p class="text-muted-custom mb-0">IN 5:00 AM | OUT 5:46 AM</p>
                    </div>

                    <div class="van-row">
                        <p class="van-plate mb-1">XYZ 5678</p>
                        <p class="text-muted-custom mb-0">IN 5:46 AM | OUT 7:22 AM</p>
                    </div>

                </div>

                <!-- Frontend only for now: this button does nothing until a backend exists -->
                <button type="button" class="btn btn-vango-primary w-100">Export file</button>

            </div>
        </main>

    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

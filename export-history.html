<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | Export History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="style-additions.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">

        <!-- Header (phone and tablet; hidden on desktop by style.css) -->
        <header class="mobile-header">
            <p class="mobile-header-label mb-1">Admin</p>
            <h1 class="mobile-header-title mb-0">Export History</h1>
        </header>

        <!-- Sidebar (desktop only) -->
        <aside class="sidebar flex-shrink-0 p-4">
            <a href="index.html" class="sidebar-brand text-white text-decoration-none">VanGo</a>
            <nav>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><span class="nav-link px-0">Passenger</span></li>
                    <li class="nav-item active"><span class="nav-link px-0">Admin</span></li>
                    <li class="nav-item"><span class="nav-link px-0">Driver / Operator</span></li>
                </ul>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <!-- Heading (desktop only) -->
                <div class="custom-block">
                    <p class="text-muted-custom mb-1">Admin</p>
                    <h1 class="page-title mb-0">Export History</h1>
                </div>

                <!-- History list: one row per trip -->
                <div class="van-list">

                    <div class="van-row">
                        <p class="van-plate mb-1">ABC 1234</p>
                        <p class="text-muted-custom mb-0">IN 5:00 AM | OUT 5:46 AM</p>
                    </div>

                    <div class="van-row">
                        <p class="van-plate mb-1">XYZ 5678</p>
                        <p class="text-muted-custom mb-0">IN 5:46 AM | OUT 7:22 AM</p>
                    </div>

                </div>

                <!-- Frontend only for now: this button does nothing until a backend exists -->
                <button type="button" class="btn btn-vango-primary w-100">Export file</button>

                <a href="menu.html" class="btn btn-vango-outline w-100">Back to menu</a>

            </div>
        </main>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VanGo | Set IN and Select Route</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="vango.css" rel="stylesheet">
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <div class="d-flex flex-column min-vh-100">

    <header class="bg-primary text-white p-3 border-bottom border-warning border-4">
      <div class="small">Van ABC 1234</div>
      <h1 class="h4 fw-bold mb-0">Arrived at Terminal</h1>
    </header>


    <form action="record-passengers.html" method="get"
          class="flex-grow-1 d-flex flex-column p-3">

      <!-- ROUTE CARD -->
      <div class="card mb-3">
        <div class="card-body">

          <!-- fieldset + legend: the correct HTML for "one question, several options".
               Screen readers read the legend ("Route") before each option.
               legend is styled as a small label with the "fs-6 mb-2" classes; without them
               the browser shows it as a large, differently spaced heading. -->
          <fieldset>
            <legend class="fs-6 fw-semibold text-secondary mb-2">Route</legend>

            <div class="btn-group w-100" role="group" aria-label="Route">
              <input type="radio" class="btn-check" name="route" id="routeLipa"
                     value="Lipa" autocomplete="off" required>
              <label class="btn btn-outline-primary flex-fill" for="routeLipa">Lipa</label>

              <input type="radio" class="btn-check" name="route" id="routeSanPablo"
                     value="San Pablo" autocomplete="off">
              <label class="btn btn-outline-primary flex-fill" for="routeSanPablo">San Pablo</label>
            </div>
          </fieldset>

        </div>
      </div>


      <div class="card">
        <div class="card-body">
          <fieldset>
            <legend class="fs-6 fw-semibold text-secondary mb-2">Status</legend>

            <div class="btn-group w-100" role="group" aria-label="Status">
              <input type="radio" class="btn-check" name="status" id="statusIn"
                     value="IN" autocomplete="off" checked>
              <label class="btn btn-outline-primary flex-fill" for="statusIn">IN</label>

              <input type="radio" class="btn-check" name="status" id="statusOut"
                     value="OUT" autocomplete="off">
              <label class="btn btn-outline-primary flex-fill" for="statusOut">OUT</label>
            </div>
          </fieldset>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-auto">
        Confirm IN
      </button>

    </form>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | Live Van Map</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="style-additions.css" rel="stylesheet">
    
</head>
<body>

    <div class="app-shell">

        

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <!-- Map placeholder (a real map can replace the text later) -->
                <div class="map-box">Map goes here</div>

                <!-- Van list: plate + route and last update on the left, status pill on the right -->
                <div class="van-list">

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">ABC 1234</p>
                            <p class="text-muted-custom mb-0">Lipa | Last update: 10 sec ago</p>
                        </div>
                        <span class="pill pill-in">IN</span>
                    </div>

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">XYZ 5678</p>
                            <p class="text-muted-custom mb-0">San Pablo | Last update: 5 sec ago</p>
                        </div>
                        <span class="pill pill-out">OUT</span>
                    </div>

                </div>

                <p class="text-muted-custom mb-0">Visible only while the driver app is open.</p>

            </div>
        </main>

    </div>

</body>
</html>

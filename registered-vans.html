<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | Registered Vans</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="style-additions.css" rel="stylesheet">

</head>
<body>

    <div class="app-shell">

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <!-- Van list: plate + driver/operator on the left, route on the right.
                     To add a van, copy one van-row. -->
                <div class="van-list">

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">ABC 1234</p>
                            <p class="text-muted-custom mb-0">Driver: Jungkick S.</p>
                        </div>
                        <span class="text-muted-custom">Lipa</span>
                    </div>

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">XYZ 5678</p>
                            <p class="text-muted-custom mb-0">Operator: Banana T.</p>
                        </div>
                        <span class="text-muted-custom">San Pablo</span>
                    </div>

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">DEF 9012</p>
                            <p class="text-muted-custom mb-0">Driver: Applelina N.</p>
                        </div>
                        <span class="text-muted-custom">Lipa</span>
                    </div>

                </div>

            </div>
        </main>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | New Van</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="style-additions.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <header class="mobile-header">
            <a href="admin.html" class="back-btn"><i class="bi bi-chevron-left"></i></a>
            <div>
                <p class="mobile-header-label mb-1">Admin</p>
                <h1 class="mobile-header-title mb-0">Register a Van</h1>
            </div>

            <div class="dropdown">
                <button class="menu-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static">
                    <span class="menu-bar"></span>
                    <span class="menu-bar"></span>
                    <span class="menu-bar"></span>
                </button>

                <ul class="dropdown-menu menu-panel">
                    <li><a class="menu-item" href="create-account.html"><i class="bi bi-person-circle"></i>Create Account</a></li>
                    <li><a class="menu-item" href="register-van.html"><i class="bi bi-truck-front-fill"></i>Register a Van</a></li>
                    <li><a class="menu-item" href="registered-vans.html"><i class="bi bi-card-list"></i>View Registered Vans</a></li>
                    <li><a class="menu-item" href="live-map.html"><i class="bi bi-geo-alt-fill"></i>Open Live Van Map</a></li>
                    <li><a class="menu-item" href="export-history.html"><i class="bi bi-box-arrow-up-right"></i>Export IN/OUT History</a></li>
                </ul>
            </div>
        </header>

        <!-- Sidebar (desktop only, hidden by style.css below 1281px) -->
        <aside class="sidebar flex-shrink-0 p-4">
            <a href="index.html" class="sidebar-brand text-white text-decoration-none">VanGo</a>
            <nav>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><span class="nav-link px-0">Passenger</span></li>
                    <li class="nav-item active"><span class="nav-link px-0">Admin</span></li>
                    <li class="nav-item"><span class="nav-link px-0">Driver / Operator</span></li>
                </ul>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <!-- Heading (desktop only; phone and tablet use the header above) -->
                <div class="custom-block">
                    <p class="text-muted-custom mb-1">Admin</p>
                    <h1 class="page-title mb-0">New Van</h1>
                </div>

                <!-- Form card -->
                <div class="form-card">

                    <div>
                        <label for="plate-number" class="field-label">Plate number</label>
                        <input type="text" id="plate-number" class="form-control input-vango" placeholder="ABC 1234">
                    </div>

                    <div>
                        <label for="dedicated-driver-operator" class="field-label">Dedicated Driver/Operator</label>
                        <input type="text" id="dedicated-driver-operator" class="form-control input-vango" placeholder="Select an account">
                    </div>

                </div>

                <p class="text-muted-custom mb-0">The plate number is used in the logbook.</p>

                <a href="menu.html" class="btn btn-vango-primary w-100">Save van</a>

            </div>
        </main>

    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
